<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OMNIRO VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root {
  --bg: #0a0a0a;
  --card: #141414;
  --border: #262626;
  --text: #f5f5f5;
  --muted: #a3a3a3;
  --accent: #ffffff;
  --green: #22c55e;
  --red: #ef4444;
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 50px;
}
.header {
  padding: 32px 20px 28px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.header p { color: var(--muted); margin-top: 6px; font-size: 14px; }
.container { padding: 20px 16px; }
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.tab.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tariff-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tariff {
  background: #1a1a1a;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  transition: 0.15s;
}
.tariff.active {
  border-color: #fff;
  background: #222;
}
.tariff .name { font-size: 14px; font-weight: 500; }
.tariff .price { font-size: 22px; font-weight: 700; margin: 6px 0 2px; }
.tariff .days { font-size: 12px; color: var(--muted); }
.btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 14px;
}
.btn-primary { background: #fff; color: #000; }
.btn-primary:active { transform: scale(0.98); }
.btn-outline {
  background: transparent;
  color: #fff;
  border: 1.5px solid var(--border);
}
.input {
  width: 100%;
  padding: 14px 16px;
  background: #1a1a1a;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: #fff;
  font-size: 16px;
  outline: none;
  margin-bottom: 10px;
}
.input:focus { border-color: #555; }
.sub {
  background: #1a1a1a;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}
.sub-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.badge {
  background: #262626;
  color: #fff;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 600;
}
.sub-config {
  font-family: ui-monospace, monospace;
  font-size: 12px;
  word-break: break-all;
  color: var(--muted);
  margin: 10px 0;
  max-height: 60px;
  overflow: hidden;
}
.sub-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.sub-actions button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #111;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}
.qr-box { text-align: center; margin: 16px 0; }
.qr-box canvas { border-radius: 12px; }
.profile {
  display: flex;
  align-items: center;
  gap: 14px;
}
.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #262626;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
}
.hidden { display: none !important; }
.success {
  background: #0f2a1a;
  border: 1px solid #166534;
  color: #4ade80;
  padding: 14px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 16px;
  font-weight: 500;
}
.empty { text-align: center; color: var(--muted); padding: 30px 0; }
</style>
</head>
<body>
<div class="header">
  <h1>OMNIRO</h1>
  <p>Premium VPN</p>
</div>

<div class="container">
  <div id="paid-ok" class="success hidden">Оплата прошла. Ключ появится ниже через пару секунд.</div>

  <div class="tabs">
    <div class="tab active" data-t="buy">Купить</div>
    <div class="tab" data-t="subs">Подписки</div>
    <div class="tab" data-t="gift">Подарить</div>
    <div class="tab" data-t="profile">Профиль</div>
  </div>

  <div id="p-buy">
    <div class="card">
      <div class="card-title">Тарифы</div>
      <div class="tariff-grid" id="tariffs"></div>
      <input class="input" id="promo" placeholder="Промокод" style="margin-top:14px">
      <button class="btn btn-primary" id="pay-btn">Оплатить</button>
    </div>
  </div>

  <div id="p-subs" class="hidden">
    <div class="card">
      <div class="card-title">Мои подписки</div>
      <div id="subs-list"><div class="empty">Загрузка...</div></div>
    </div>
  </div>

  <div id="p-gift" class="hidden">
    <div class="card">
      <div class="card-title">Подарить другу</div>
      <input class="input" id="gift-user" placeholder="@username">
      <div id="gift-check" style="font-size:13px;margin-bottom:12px;color:var(--muted)"></div>
      <div class="tariff-grid" id="gift-tariffs"></div>
      <button class="btn btn-primary" id="gift-btn">Подарить</button>
    </div>
  </div>

  <div id="p-profile" class="hidden">
    <div class="card">
      <div class="card-title">Профиль</div>
      <div class="profile">
        <div class="avatar" id="av">?</div>
        <div>
          <div style="font-weight:600;font-size:17px" id="pname">—</div>
          <div style="color:var(--muted);font-size:14px" id="puname">—</div>
        </div>
      </div>
      <div style="margin-top:16px;font-size:13px;color:var(--muted)" id="pdate"></div>
    </div>
    <div class="card" style="text-align:center">
      <a class="btn btn-outline" id="support" href="#" style="text-decoration:none;display:block">Поддержка</a>
      <div style="margin-top:14px;font-size:12px;color:#555">
        <a href="https://telegra.ph/POLITIKA-KONFIDENCIALNOSTI-08-12-99" style="color:#555">Политика</a> · 
        <a href="https://telegra.ph/PUBLICHNAYA-OFERTA-08-12-15" style="color:#555">Оферта</a>
      </div>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
tg.setHeaderColor('#0a0a0a');
tg.setBackgroundColor('#0a0a0a');

const user = tg.initDataUnsafe?.user || {};
const uid = user.id;
let selected = '1m';
let giftSelected = '1m';
let tariffs = {};
let subs = [];

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    ['buy','subs','gift','profile'].forEach(p => {
      document.getElementById('p-'+p).classList.toggle('hidden', p !== t.dataset.t);
    });
    if (t.dataset.t === 'subs') renderSubs();
  };
});

async function load() {
  if (!uid) return;
  const r = await fetch(`/api/me?user_id=${uid}`);
  const d = await r.json();
  tariffs = d.tariffs;
  subs = d.subscriptions;

  document.getElementById('pname').textContent = d.first_name || 'Пользователь';
  document.getElementById('puname').textContent = d.username ? '@'+d.username : 'ID '+uid;
  document.getElementById('av').textContent = (d.first_name || 'U')[0].toUpperCase();
  if (d.created_at) document.getElementById('pdate').textContent = 'С нами с ' + d.created_at.slice(0,10);

  const grid = document.getElementById('tariffs');
  const ggrid = document.getElementById('gift-tariffs');
  grid.innerHTML = ggrid.innerHTML = '';
  for (const [k,t] of Object.entries(tariffs)) {
    const el = document.createElement('div');
    el.className = 'tariff' + (k==='1m'?' active':'');
    el.innerHTML = `<div class="name">${t.name}</div><div class="price">${t.price}₽</div><div class="days">${t.days} дн.</div>`;
    el.onclick = () => {
      document.querySelectorAll('#tariffs .tariff').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      selected = k;
    };
    grid.appendChild(el);

    const ge = el.cloneNode(true);
    ge.onclick = () => {
      document.querySelectorAll('#gift-tariffs .tariff').forEach(e => e.classList.remove('active'));
      ge.classList.add('active');
      giftSelected = k;
    };
    ggrid.appendChild(ge);
  }
  renderSubs();
}

function renderSubs() {
  const box = document.getElementById('subs-list');
  if (!subs.length) {
    box.innerHTML = '<div class="empty">Подписок пока нет</div>';
    return;
  }
  box.innerHTML = subs.map(s => `
    <div class="sub">
      <div class="sub-header">
        <span class="badge">${s.tariff_name}</span>
        <span style="font-size:13px;color:var(--muted)">до ${s.expires_at.slice(0,10)}</span>
      </div>
      <div class="sub-config">${s.config || s.key_name}</div>
      <div class="qr-box" id="qr-${s.id}"></div>
      <div class="sub-actions">
        <button onclick="copyCfg(${s.id})">Копировать</button>
        <button onclick="renew(${s.id})">Продлить</button>
        <button onclick="delSub(${s.id})" style="color:#ef4444">Удалить</button>
      </div>
    </div>
  `).join('');

  subs.forEach(s => {
    if (s.config && (s.config.startsWith('vless://') || s.config.startsWith('ss://') || s.config.includes('://'))) {
      const el = document.getElementById('qr-'+s.id);
      if (el) {
        QRCode.toCanvas(document.createElement('canvas'), s.config, {
          width: 160, margin: 1,
          color: { dark: '#ffffff', light: '#141414' }
        }, (err, canvas) => {
          if (!err) {
            canvas.style.borderRadius = '12px';
            el.appendChild(canvas);
          }
        });
      }
    }
  });
}

window.copyCfg = (id) => {
  const s = subs.find(x => x.id == id);
  if (s) {
    navigator.clipboard.writeText(s.config || s.key_name);
    tg.showPopup({ title: 'Скопировано', message: 'Конфиг скопирован', buttons: [{type:'ok'}] });
  }
};

window.renew = async (id) => {
  const r = await fetch('/api/renew', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user_id: uid, sub_id: id})
  });
  const d = await r.json();
  if (d.pay_url) tg.openLink(d.pay_url);
};

window.delSub = async (id) => {
  if (!confirm('Удалить подписку? Ключ будет отозван.')) return;
  await fetch('/api/delete_sub', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({user_id: uid, sub_id: id})
  });
  await load();
};

document.getElementById('pay-btn').onclick = async () => {
  const btn = document.getElementById('pay-btn');
  btn.disabled = true;
  btn.textContent = 'Создаём...';
  try {
    const r = await fetch('/api/create_payment', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        user_id: uid,
        tariff: selected,
        promo: document.getElementById('promo').value
      })
    });
    const d = await r.json();
    if (d.pay_url) tg.openLink(d.pay_url);
    else alert('Ошибка создания платежа');
  } catch(e) {
    alert(e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Оплатить';
};

document.getElementById('gift-user').oninput = async function() {
  const v = this.value.trim();
  const el = document.getElementById('gift-check');
  if (v.length < 3) { el.textContent = ''; return; }
  const r = await fetch(`/api/check_user?username=${encodeURIComponent(v)}`);
  const d = await r.json();
  el.textContent = d.exists ? `Найден: ${d.first_name}` : 'Пользователь не найден (должен написать /start)';
  el.style.color = d.exists ? '#22c55e' : '#ef4444';
};

document.getElementById('gift-btn').onclick = async () => {
  const to = document.getElementById('gift-user').value.trim();
  if (!to) return alert('Укажи @username');
  const r = await fetch('/api/create_payment', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      user_id: uid,
      tariff: giftSelected,
      is_gift: true,
      gift_to: to
    })
  });
  if (!r.ok) {
    const e = await r.json();
    return alert(e.detail || 'Ошибка');
  }
  const d = await r.json();
  if (d.pay_url) tg.openLink(d.pay_url);
};

if (new URLSearchParams(location.search).get('paid') === '1') {
  document.getElementById('paid-ok').classList.remove('hidden');
  setTimeout(load, 2500);
}

document.getElementById('support').href = 'https://t.me/' + ('' || 'support');

load();
</script>
</body>
</html>
