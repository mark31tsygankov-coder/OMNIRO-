<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VPN Service</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #0c0c0c;
      --card-hover: #141414;
      --border-color: #222222;
      --border-active: #ffffff;
      --text-main: #ffffff;
      --text-muted: #777777;
      --accent: #ffffff;
      --radius: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 40px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .user-badge {
      font-size: 11px;
      color: var(--text-muted);
      background: #141414;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-family: monospace;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
    }

    .welcome-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .welcome-sub {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #050505;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-top: 14px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: #ffffff;
      color: #000000;
    }

    .gift-box {
      display: none;
      margin-top: 12px;
    }

    input {
      width: 100%;
      background: #050505;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }
    input:focus {
      border-color: var(--border-active);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin: 4px 0 2px 4px;
      font-weight: 700;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .btn-plan {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-plan.selected {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn-plan.selected .plan-price {
      color: #000000;
    }

    .btn-plan.selected .plan-name {
      color: #555555;
    }

    .plan-name {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .plan-price {
      font-size: 16px;
      font-weight: 800;
      margin-top: 6px;
      color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius);
      border: none;
      background-color: #ffffff;
      color: #000000;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    .btn-outline {
      background-color: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--border-color);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .result-box {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      flex-direction: column;
      gap: 16px;
    }

    .link-field {
      background: #050505;
      border: 1px dashed var(--border-color);
      padding: 14px;
      border-radius: var(--radius-sm);
      word-break: break-all;
      font-family: monospace;
      font-size: 11px;
      color: var(--text-muted);
      max-height: 90px;
      overflow-y: auto;
    }

    .qr-container {
      text-align: center;
      padding: 14px;
      background: #ffffff;
      border-radius: var(--radius-sm);
      display: inline-block;
      margin: 0 auto;
    }
    .qr-container img {
      width: 150px;
      height: 150px;
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container" id="main-view">
    <div class="header">
      <div class="brand-title">VPN Service</div>
      <div class="user-badge" id="user-id-badge">ID: ...</div>
    </div>

    <div class="card">
      <div class="welcome-title">Быстрый доступ</div>
      <div class="welcome-sub">Выберите тариф и оформите подписку.</div>
      
      <div class="mode-switch">
        <button class="mode-btn active" id="mode-self" onclick="setMode('self')">Себе</button>
        <button class="mode-btn" id="mode-gift" onclick="setMode('gift')">В подарок</button>
      </div>

      <div class="gift-box" id="gift-input-box">
        <input type="number" id="gift-target-id" placeholder="Введите Telegram ID друга">
      </div>
    </div>

    <div class="section-title">Тарифные планы</div>
    <div class="btn-grid">
      <div class="btn-plan selected" onclick="selectPlan('m1', 79, this)">
        <div class="plan-name">1 Месяц</div>
        <div class="plan-price">79 руб</div>
      </div>
      <div class="btn-plan" onclick="selectPlan('m3', 219, this)">
        <div class="plan-name">3 Месяца</div>
        <div class="plan-price">219 руб</div>
      </div>
      <div class="btn-plan" onclick="selectPlan('m6', 399, this)">
        <div class="plan-name">6 Месяцев</div>
        <div class="plan-price">399 руб</div>
      </div>
    </div>

    <button class="btn" id="pay-btn" onclick="proceedToPay()" style="margin-top: 4px;">Оплатить 79 руб</button>

    <div class="section-title">Управление</div>
    <div class="menu-grid">
      <button class="btn btn-outline" onclick="openMySubs()">Мои подписки</button>
      <button class="btn btn-outline" onclick="openPromos()">Промокоды</button>
      <button class="btn btn-outline" onclick="openReferrals()">Рефералы</button>
      <button class="btn btn-outline" onclick="openSupport()">Поддержка</button>
    </div>
  </div>

  <div class="container hidden" id="result-view">
    <div class="header">
      <div class="brand-title">VPN Ключ</div>
      <div class="user-badge" onclick="backToMain()" style="cursor: pointer;">Закрыть</div>
    </div>

    <div class="result-box">
      <div class="welcome-sub" id="result-desc">Подписка успешно активирована. Скопируйте ключ или отсканируйте QR-код.</div>
      
      <div class="qr-container">
        <img id="qr-img" src="" alt="QR Code">
      </div>

      <div class="section-title">Ключ подключения</div>
      <div class="link-field" id="vpn-link-text">vless://...</div>

      <button class="btn" onclick="copyKey()">Скопировать ключ</button>
      <button class="btn btn-outline" onclick="openInApp()">Открыть в приложении</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let selectedPlanKey = 'm1';
    let selectedPrice = 79;
    let purchaseMode = 'self';
    let activeVpnLink = '';

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('user-id-badge').innerText = `ID: ${user.id}`;
    }

    function setMode(mode) {
      purchaseMode = mode;
      const selfBtn = document.getElementById('mode-self');
      const giftBtn = document.getElementById('mode-gift');
      const giftBox = document.getElementById('gift-input-box');
      const payBtn = document.getElementById('pay-btn');

      if (mode === 'self') {
        selfBtn.classList.add('active');
        giftBtn.classList.remove('active');
        giftBox.classList.add('hidden');
        payBtn.innerText = `Оплатить ${selectedPrice} руб`;
      } else {
        giftBtn.classList.add('active');
        selfBtn.classList.remove('active');
        giftBox.classList.remove('hidden');
        payBtn.innerText = `Оплатить подарок (${selectedPrice} руб)`;
      }
    }

    function selectPlan(key, price, element) {
      selectedPlanKey = key;
      selectedPrice = price;
      
      document.querySelectorAll('.btn-plan').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');

      const payBtn = document.getElementById('pay-btn');
      if (purchaseMode === 'self') {
        payBtn.innerText = `Оплатить ${price} руб`;
      } else {
        payBtn.innerText = `Оплатить подарок (${price} руб)`;
      }
    }

    function proceedToPay() {
      let targetId = null;
      if (purchaseMode === 'gift') {
        targetId = document.getElementById('gift-target-id').value.trim();
        if (!targetId) {
          tg.showAlert("Введите Telegram ID друга для подарка.");
          return;
        }
      }

      tg.sendData(JSON.stringify({ 
        action: 'buy_plan', 
        plan: selectedPlanKey, 
        price: selectedPrice,
        mode: purchaseMode,
        target_id: targetId 
      }));
    }

    function openMySubs() {
      tg.sendData(JSON.stringify({ action: 'open_my_subs' }));
    }

    function openPromos() {
      tg.sendData(JSON.stringify({ action: 'open_promos' }));
    }

    function openReferrals() {
      tg.sendData(JSON.stringify({ action: 'open_referrals' }));
    }

    function openSupport() {
      tg.sendData(JSON.stringify({ action: 'open_support' }));
    }

    function showSuccessKey(link, descText = '') {
      activeVpnLink = link;
      document.getElementById('main-view').classList.add('hidden');
      document.getElementById('result-view').classList.remove('hidden');
      document.getElementById('vpn-link-text').innerText = link;
      
      if (descText) {
        document.getElementById('result-desc').innerText = descText;
      }

      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(link)}`;
      document.getElementById('qr-img').src = qrUrl;
    }

    function backToMain() {
      document.getElementById('result-view').classList.add('hidden');
      document.getElementById('main-view').classList.remove('hidden');
    }

    function copyKey() {
      navigator.clipboard.writeText(activeVpnLink);
      tg.showAlert("Ключ скопирован в буфер обмена.");
    }

    function openInApp() {
      window.open(activeVpnLink, '_blank');
    }
  </script>
</body>
</html>
