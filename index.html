<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNIRO VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --text: #1e293b;
            --muted: #64748b;
            --success: #10b981;
            --radius: 18px;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }
        .header {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 28px 20px 40px;
            border-radius: 0 0 28px 28px;
            text-align: center;
        }
        .header h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
        .header p { opacity: 0.9; font-size: 15px; }
        .container { padding: 0 16px; margin-top: -24px; }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .card-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            color: white;
            background: var(--primary);
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-outline {
            background: white;
            color: var(--primary);
            border: 2px solid #e2e8f0;
        }
        .tariff-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .tariff {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tariff.active {
            border-color: var(--primary);
            background: #eff6ff;
        }
        .tariff .name { font-weight: 600; font-size: 15px; }
        .tariff .price { font-size: 20px; font-weight: 700; color: var(--primary); margin: 6px 0; }
        .tariff .days { font-size: 13px; color: var(--muted); }
        .input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }
        .input:focus { border-color: var(--primary); }
        .sub-item {
            background: #f8fafc;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .sub-item .key { font-family: monospace; font-size: 13px; word-break: break-all; }
        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .hidden { display: none !important; }
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .tab {
            flex-shrink: 0;
            padding: 10px 18px;
            border-radius: 12px;
            background: white;
            border: 2px solid #e2e8f0;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .success-msg {
            background: #ecfdf5;
            color: #065f46;
            padding: 16px;
            border-radius: 14px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>OMNIRO VPN</h1>
        <p>Быстрый • Стабильный • Анонимный</p>
    </div>

    <div class="container">
        <div id="paid-success" class="success-msg hidden">
            ✅ Оплата прошла! Ключ отправлен в бот.
        </div>

        <div class="tab-bar">
            <div class="tab active" data-tab="buy">Купить</div>
            <div class="tab" data-tab="subs">Мои подписки</div>
            <div class="tab" data-tab="gift">Подарить</div>
            <div class="tab" data-tab="promo">Промокод</div>
        </div>

        <!-- BUY -->
        <div id="tab-buy" class="card">
            <div class="card-title">📦 Выбери тариф</div>
            <div class="tariff-grid" id="tariffs"></div>
            <div style="margin-top: 16px;">
                <input class="input" id="promo-input" placeholder="Промокод (если есть)">
                <button class="btn btn-primary" id="btn-pay">Оплатить</button>
            </div>
        </div>

        <!-- SUBS -->
        <div id="tab-subs" class="card hidden">
            <div class="card-title">🔑 Мои подписки</div>
            <div id="subs-list">Загрузка...</div>
        </div>

        <!-- GIFT -->
        <div id="tab-gift" class="card hidden">
            <div class="card-title">🎁 Подарить подписку</div>
            <input class="input" id="gift-username" placeholder="@username друга">
            <div class="tariff-grid" id="gift-tariffs"></div>
            <button class="btn btn-success" id="btn-gift" style="margin-top: 16px;">Подарить</button>
        </div>

        <!-- PROMO -->
        <div id="tab-promo" class="card hidden">
            <div class="card-title">🏷 Промокод</div>
            <input class="input" id="promo-check" placeholder="Введи промокод">
            <button class="btn btn-outline" id="btn-check-promo">Проверить</button>
            <div id="promo-result" style="margin-top: 12px; text-align: center;"></div>
        </div>

        <!-- SUPPORT -->
        <div class="card" style="text-align: center;">
            <div class="card-title" style="justify-content: center;">💬 Поддержка</div>
            <a class="btn btn-outline" id="support-btn" href="#">Написать в поддержку</a>
            <div style="margin-top: 12px; font-size: 13px; color: var(--muted);">
                <a href="#" id="policy" style="color: var(--muted);">Политика</a> · 
                <a href="#" id="offer" style="color: var(--muted);">Оферта</a>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#1d4ed8');
        tg.setBackgroundColor('#f5f7fa');

        const user = tg.initDataUnsafe?.user || {};
        const userId = user.id;
        let selectedTariff = '1m';
        let selectedGiftTariff = '1m';
        let tariffs = {};

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('[id^=tab-]').forEach(el => el.classList.add('hidden'));
                document.getElementById('tab-' + tab.dataset.tab).classList.remove('hidden');
            };
        });

        // Load data
        async function loadUser() {
            if (!userId) return;
            const res = await fetch(`/api/user?user_id=${userId}`);
            const data = await res.json();
            tariffs = data.tariffs;

            // Tariffs
            const grid = document.getElementById('tariffs');
            const giftGrid = document.getElementById('gift-tariffs');
            grid.innerHTML = '';
            giftGrid.innerHTML = '';
            for (const [k, t] of Object.entries(tariffs)) {
                const el = document.createElement('div');
                el.className = 'tariff' + (k === '1m' ? ' active' : '');
                el.innerHTML = `<div class="name">${t.name}</div><div class="price">${t.price} ₽</div><div class="days">${t.days} дней</div>`;
                el.onclick = () => {
                    document.querySelectorAll('#tariffs .tariff').forEach(e => e.classList.remove('active'));
                    el.classList.add('active');
                    selectedTariff = k;
                };
                grid.appendChild(el);

                const gel = el.cloneNode(true);
                gel.onclick = () => {
                    document.querySelectorAll('#gift-tariffs .tariff').forEach(e => e.classList.remove('active'));
                    gel.classList.add('active');
                    selectedGiftTariff = k;
                };
                giftGrid.appendChild(gel);
            }

            // Subs
            const list = document.getElementById('subs-list');
            if (!data.subscriptions.length) {
                list.innerHTML = '<p style="color:#64748b;text-align:center;">Подписок пока нет</p>';
            } else {
                list.innerHTML = data.subscriptions.map(s => `
                    <div class="sub-item">
                        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
                            <span class="badge">${tariffs[s.tariff]?.name || s.tariff}</span>
                            <span style="font-size:13px;color:#64748b;">до ${s.expires_at.slice(0,10)}</span>
                        </div>
                        <div class="key">${s.config || s.key_name}</div>
                    </div>
                `).join('');
            }
        }

        // Pay
        document.getElementById('btn-pay').onclick = async () => {
            const promo = document.getElementById('promo-input').value.trim();
            const btn = document.getElementById('btn-pay');
            btn.disabled = true;
            btn.textContent = 'Создаём платёж...';
            try {
                const res = await fetch('/api/create_payment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, tariff: selectedTariff, promo })
                });
                const data = await res.json();
                if (data.pay_url) {
                    tg.openLink(data.pay_url);
                } else {
                    alert('Ошибка создания платежа');
                }
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
            btn.disabled = false;
            btn.textContent = 'Оплатить';
        };

        // Gift
        document.getElementById('btn-gift').onclick = async () => {
            const to = document.getElementById('gift-username').value.trim();
            if (!to) return alert('Укажи @username');
            const res = await fetch('/api/create_payment', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, tariff: selectedGiftTariff, is_gift: true, gift_to: to })
            });
            const data = await res.json();
            if (data.pay_url) tg.openLink(data.pay_url);
        };

        // Promo check
        document.getElementById('btn-check-promo').onclick = async () => {
            const code = document.getElementById('promo-check').value.trim();
            const res = await fetch(`/api/promocode?code=${code}`);
            const data = await res.json();
            document.getElementById('promo-result').innerHTML = data.valid
                ? `<span style="color:#059669;font-weight:600;">Скидка ${data.discount}%</span>`
                : `<span style="color:#dc2626;">Промокод недействителен</span>`;
        };

        // Support & links
        document.getElementById('support-btn').href = 'https://t.me/' + (tg.initDataUnsafe?.user ? '' : '');
        document.getElementById('policy').href = 'https://telegra.ph/POLITIKA-KONFIDENCIALNOSTI-08-12-99';
        document.getElementById('offer').href = 'https://telegra.ph/PUBLICHNAYA-OFERTA-08-12-15';

        // Paid redirect
        if (new URLSearchParams(location.search).get('paid') === '1') {
            document.getElementById('paid-success').classList.remove('hidden');
        }

        loadUser();
    </script>
</body>
</html>
